[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "getdone-dev"
dynamic = ["version"]
description = "Structured, evidence-driven development workflows for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GetDone contributors" }]
keywords = ["coding-agents", "developer-tools", "workflows", "quality-gates", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "jsonschema>=4.20",
  "PyYAML>=6.0",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
docs = [
  "zensical==0.0.51",
]
release = [
  "build>=1.2,<2",
  "twine>=5,<7",
  "zensical==0.0.51",
]

[project.scripts]
getdone = "getdone.cli:main"
getdone-init = "getdone.initialise_project:main"
getdone-check-updates = "getdone.check_template_updates:main"
getdone-migrate = "getdone.apply_template_updates:main"
getdone-validate-project = "getdone.validate_project:main"
getdone-validate-records = "getdone.project_records:main"
getdone-install-adapter = "getdone.install_adapter:main"
getdone-search = "getdone.search_catalogue:main"
getdone-validate-overlay = "getdone.validate_catalogue_overlay:main"
getdone-lock = "getdone.manage_composition_lock:main"
getdone-select-context = "getdone.context_selection:main"

[tool.setuptools.packages.find]
include = ["getdone*"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["getdone", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
