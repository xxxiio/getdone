name: publish-pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch annotated release tag
        shell: bash
        run: |
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::Release ref ${GITHUB_REF_NAME} is not an annotated tag."
            exit 1
          fi

      - name: Verify tag points to main HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --no-tags
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          main_commit="$(git rev-parse origin/main)"
          if [[ "${tag_commit}" != "${main_commit}" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} points to ${tag_commit}, but origin/main points to ${main_commit}."
            echo "Create the release tag from the current main commit and push the tag again."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]" build twine

      - name: Verify release metadata
        run: python development/scripts/verify_release.py --repository-root . --tag "${GITHUB_REF_NAME}"

      - name: Validate generated content
        run: |
          python development/scripts/generate_indexes.py --repository-root .
          python development/scripts/generate_docs.py --repository-root .
          zensical build --strict

      - name: Build distributions
        run: python -m build

      - name: Verify bundled distribution assets
        run: python development/scripts/verify_distribution_assets.py --repository-root . --dist-dir dist

      - name: Build skill-pack and checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m development.tools.build_skill_pack --repository-root . --output "dist/getdone-skill-pack-${version}.zip"
          (
            cd dist
            sha256sum *.whl *.tar.gz *.zip > "getdone-${version}-SHA256SUMS.txt"
          )

      - name: Check distributions
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Upload distributions as workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: Verify PyPI credential is configured
        shell: bash
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PYPI_API_TOKEN}" ]]; then
            echo "::error::Repository secret PYPI_API_TOKEN is not configured."
            exit 1
          fi

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive --verbose dist/*.whl dist/*.tar.gz

      - name: Create GitHub release with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "GetDone ${GITHUB_REF_NAME#v}" \
            --generate-notes
